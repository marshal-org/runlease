# Abstract compute class → ordered concrete instance types per provider.
# First entry in each list is preferred; resolver picks the first one for M1.
# Add more candidates in priority order for price/availability resilience.
classes:
  compute.micro:     # ~1 vCPU / 1 GB  — minimal footprint, relay/proxy workloads
    aws:
      - t3.micro
      - t3a.micro
    gcp:
      - e2-micro
      - f1-micro

  compute.small:     # ~2 vCPU / 2 GB  — light jobs
    aws:
      - t3.small
      - t3a.small
    gcp:
      - e2-small
      - n1-standard-1

  compute.medium:    # ~2 vCPU / 4 GB  — typical CI runner
    aws:
      - c5.large
      - c5a.large
      - m5.large
    gcp:
      - e2-medium
      - n2-standard-2

  compute.large:     # ~4 vCPU / 8 GB  — heavier CI, parallel test suites
    aws:
      - c5.xlarge
      - c5a.xlarge
      - m5.xlarge
    gcp:
      - e2-standard-4
      - n2-standard-4
      - c2-standard-4

  compute.xlarge:    # ~8 vCPU / 16 GB — build-heavy workloads
    aws:
      - c5.2xlarge
      - c5a.2xlarge
      - m5.2xlarge
    gcp:
      - e2-standard-8
      - n2-standard-8
      - c2-standard-8

  compute.2xlarge:   # ~16 vCPU / 32 GB — intensive parallel workloads
    aws:
      - c5.4xlarge
      - c5a.4xlarge
      - m5.4xlarge
    gcp:
      - e2-standard-16
      - n2-standard-16
      - c2-standard-16

  compute.gpu:       # ~4-8 vCPU / 16-32 GB + 1 GPU — ML inference / training
    aws:
      - g4dn.xlarge   # 4 vCPU, 16 GB, 1x NVIDIA T4
      - g4dn.2xlarge  # 8 vCPU, 32 GB, 1x NVIDIA T4
      - p3.2xlarge    # 8 vCPU, 61 GB, 1x NVIDIA V100
    gcp:
      - n1-standard-4  # 4 vCPU, 15 GB + attach accelerator: nvidia-tesla-t4
      - n1-standard-8  # 8 vCPU, 30 GB + attach accelerator: nvidia-tesla-t4
