name: OpenSSF Scorecard

# Scores the repository against the OpenSSF supply-chain checks and publishes
# the result. Only meaningful, and only allowed, on a public repository.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"

permissions: read-all

jobs:
  scorecard:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: results.sarif
