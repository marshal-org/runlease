name: Website

# Publishes the site/ directory to GitHub Pages.
#
# Trust model (see docs/ci.md):
#   - Runs only for code already on main, or when a maintainer starts it.
#   - Needs no secret: GitHub Pages deployment uses the workflow's own OIDC
#     identity.
#   - Skips itself until Pages is switched on for the repository, so merging
#     this file publishes nothing by accident.

on:
  push:
    # PRE-LAUNCH: public-relay is listed so the site can be published before
    # this branch is merged. Remove it (and the branch's entry in the
    # github-pages environment) when the branch merges.
    branches: [main, public-relay]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the site
        run: scripts/check-site.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
