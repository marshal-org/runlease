# For a subnet with no NAT gateway. By default a machine launched through a
# relay gets no public address and dials out through NAT. Without NAT it needs
# a public address to reach the relay. SSH still listens on localhost only.
#
#   runlease up -m no-nat.yaml
name: scratch
provider: gcp
region: us-central1-a
instanceClass: compute.small
publicIp: true                 # outbound only: nothing of Runlease's listens on it
reclaim:
  ttl: 2h
relay:
  addr: wss://connect.runlease.online
