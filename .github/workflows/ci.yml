name: CI

# Runs on every pull request, including pull requests from forks.
#
# Trust model (see docs/ci.md):
#   - Triggered by `pull_request`, so code from a fork runs with a read-only
#     token and no secrets.
#   - GitHub-hosted runners only. Nothing here runs on infrastructure we own,
#     and no organisation secret or variable is referenced.
#   - Every action is pinned to a full commit SHA.
#   - scripts/check-workflows.sh enforces all of the above on every change.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      # A relay change must not break the agents of CLIs already in use: run the
      # latest release's agent against the relay built from this commit.
      - name: Latest released agent works with this relay
        run: |
          base=https://github.com/marshal-org/runlease/releases/latest/download
          d="$(mktemp -d)"
          curl -fsSL -o "$d/runlease-agent-linux-amd64" "$base/runlease-agent-linux-amd64"
          curl -fsSL -o "$d/checksums.txt" "$base/checksums.txt"
          (cd "$d" && grep ' runlease-agent-linux-amd64$' checksums.txt | sha256sum -c -)
          chmod +x "$d/runlease-agent-linux-amd64"
          RUNLEASE_COMPAT_AGENT="$d/runlease-agent-linux-amd64" go test -count=1 -run TestRelay_releasedAgent -v ./pkg/relay
      # The release builds all five targets. Here we only prove the code still
      # compiles on the two operating systems the test job does not run on.
      - name: Cross-compile for macOS and Windows
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/runlease
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/runlease
      # The bundle scripts otherwise run only during a release, where a failure
      # stops the upload.
      - name: MCP bundle builds and lists the server's tools
        run: scripts/check-mcpb.sh
      # skills/, commands/, antigravity/ and claude-directory/ are copies of plugin/.
      - name: Generated plugin copies match plugin/
        run: python3 scripts/gen-agent-plugins.py --check

  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/check-workflows.sh
      - run: scripts/check-site.sh

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

  dependency-review:
    name: Dependency review
    # Needs the dependency graph, which is free on public repositories only.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
