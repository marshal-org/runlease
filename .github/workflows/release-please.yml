name: Release Please

# Runs on every push to main. release-please maintains a single "release PR"
# from conventional-commit history (feat -> minor, fix -> patch). Merging that
# PR bumps the version, updates CHANGELOG.md, and creates the `vX.Y.Z` tag and
# GitHub Release. The jobs below are gated on that release being created in the
# same run, so no personal access token is needed.
#
# What a release contains (see docs/ci.md and docs/security.md):
#   - CLI binaries for linux, darwin and windows
#   - agent and relay binaries for linux
#   - one MCP bundle (.mcpb) per CLI binary, for MCP clients that install bundles
#   - checksums.txt with the SHA-256 of every file
#   - on a public repository: a keyless Sigstore signature of checksums.txt and
#     a build provenance attestation for every binary
#
# After the upload, the last job publishes the release's server.json to the
# MCP Registry (see docs/mcp.md). It signs in with the workflow's OIDC token,
# so there is no registry secret. If it fails, the release is already complete
# and the job can be run again on its own.
#
# The CLI is built AFTER the agent, with the agent's SHA-256 compiled in. A VM
# launched by a release CLI refuses any agent binary that does not match it.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  server:
    name: Build agent and relay
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      agent_sha256: ${{ steps.digest.outputs.agent_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/runlease-agent-linux-${arch}" ./cmd/runlease-agent
            GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/runlease-relay-linux-${arch}" ./cmd/runlease-relay
          done
      - name: Agent digest
        id: digest
        run: echo "agent_sha256=$(sha256sum dist/runlease-agent-linux-amd64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/*
          if-no-files-found: error

  cli:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [release-please, server]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          AGENT_SHA256: ${{ needs.server.outputs.agent_sha256 }}
        run: |
          test -n "$AGENT_SHA256"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.agentSHA256=${AGENT_SHA256}" \
            -o "dist/runlease-${GOOS}-${GOARCH}${EXT}" ./cmd/runlease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Wraps each CLI binary in an MCP bundle. It runs before `publish` so the
  # bundles are checksummed, signed and attested with everything else, and in
  # its own job so the checkout stays out of the job that holds write tokens.
  bundles:
    name: Build MCP bundles
    needs: [release-please, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Build
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          scripts/build-mcpb.sh "$VERSION" dist
          count="$(find dist -name '*.mcpb' | wc -l)"
          [ "$count" -eq 5 ] || { echo "expected 5 bundles, built $count"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: dist/*.mcpb
          if-no-files-found: error

  publish:
    name: Checksums, signature, upload
    needs: [release-please, server, cli, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum runlease* > checksums.txt && cat checksums.txt
      # Keyless signing writes the repository identity to a public transparency
      # log, so it only runs once the repository itself is public.
      - name: Install cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/runlease*
      - name: Upload to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  # Lists the release in the MCP Registry. Everything it publishes is already
  # on the GitHub release: a failure here (the registry is down, say) shows up
  # as a failed job and leaves the release as it is. Re-running the job is
  # safe: a version the registry already has is skipped.
  registry:
    name: Publish to the MCP Registry
    needs: [release-please, publish]
    # The registry needs the bundles to be publicly downloadable.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the registry sign-in; it grants io.github.<owner>/*
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_REGISTRY: https://registry.modelcontextprotocol.io
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fetched the way a client fetches them, so server.json describes the
      # bytes the release really serves.
      - name: Download the bundles from the release
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir bundles && cd bundles
          curl -fsSL --retry 3 -o checksums.txt "${base}/checksums.txt"
          grep -E ' \*?runlease-[a-z0-9]+-[a-z0-9]+\.mcpb$' checksums.txt > mcpb.sums
          for f in $(awk '{ sub(/^\*/, "", $2); print $2 }' mcpb.sums); do
            curl -fsSL --retry 3 -o "$f" "${base}/${f}"
          done
          sha256sum --check mcpb.sums
          rm checksums.txt mcpb.sums
      - name: Generate server.json
        run: |
          scripts/gen-server-json.sh "$TAG" bundles > server.json
          cat server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL --retry 3 -o "$archive" "${base}/${archive}"
          curl -fsSL --retry 3 -o "${archive}.sigstore.json" "${base}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "${archive}.sigstore.json"
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Publish
        run: |
          set -euo pipefail
          name="$(jq -r '.name' server.json)"
          version="$(jq -r '.version' server.json)"
          url="${MCP_REGISTRY}/v0/servers/$(jq -rn --arg n "$name" '$n | @uri')/versions/${version}"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then
            echo "${name} ${version} is already in the registry. Nothing to publish."
            exit 0
          fi
          for attempt in 1 2 3; do
            if ./mcp-publisher login github-oidc --registry="$MCP_REGISTRY" &&
               ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "Attempt ${attempt} failed."
            [ "$attempt" -eq 3 ] || sleep 30
          done
          echo "Could not publish ${name} ${version}. The GitHub release is complete; re-run this job to try again."
          exit 1
