name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          SUFFIX="${GOOS}-${GOARCH}"
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          mkdir dist
          go build -ldflags="$LDFLAGS" -o "dist/runlease-${SUFFIX}${EXT}" ./cmd/runlease
          if [ "$GOOS" = "linux" ]; then
            go build -ldflags="$LDFLAGS" -o "dist/runlease-agent-${SUFFIX}" ./cmd/runlease-agent
            go build -ldflags="$LDFLAGS" -o "dist/runlease-relay-${SUFFIX}" ./cmd/runlease-relay
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
