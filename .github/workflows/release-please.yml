name: Release Please

# Runs on every push to main. release-please maintains a single "release PR"
# from conventional-commit history (feat → minor, fix → patch). Merging that PR
# bumps the version, updates CHANGELOG.md, and creates the `vX.Y.Z` git tag +
# GitHub Release. The build job below is gated on that release being created in
# the same run — so it uploads the cross-platform binaries to the new release
# without needing a PAT (a tag pushed by GITHUB_TOKEN can't trigger a separate
# tag-triggered workflow).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          SUFFIX="${GOOS}-${GOARCH}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir dist
          go build -ldflags="$LDFLAGS" -o "dist/runlease-${SUFFIX}${EXT}" ./cmd/runlease
          if [ "$GOOS" = "linux" ]; then
            go build -ldflags="$LDFLAGS" -o "dist/runlease-agent-${SUFFIX}" ./cmd/runlease-agent
            go build -ldflags="$LDFLAGS" -o "dist/runlease-relay-${SUFFIX}" ./cmd/runlease-relay
          fi

      - name: Upload binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
