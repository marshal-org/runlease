name: Release Please

# Runs on every push to main. release-please maintains a single "release PR"
# from conventional-commit history (feat -> minor, fix -> patch). Merging that
# PR bumps the version, updates CHANGELOG.md, and creates the `vX.Y.Z` tag and
# GitHub Release. The jobs below are gated on that release being created in the
# same run, so no personal access token is needed.
#
# What a release contains (see docs/ci.md and docs/security.md):
#   - CLI binaries for linux, darwin and windows
#   - agent and relay binaries for linux
#   - checksums.txt with the SHA-256 of every file
#   - on a public repository: a keyless Sigstore signature of checksums.txt and
#     a build provenance attestation for every binary
#
# The CLI is built AFTER the agent, with the agent's SHA-256 compiled in. A VM
# launched by a release CLI refuses any agent binary that does not match it.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  server:
    name: Build agent and relay
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      agent_sha256: ${{ steps.digest.outputs.agent_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/runlease-agent-linux-${arch}" ./cmd/runlease-agent
            GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/runlease-relay-linux-${arch}" ./cmd/runlease-relay
          done
      - name: Agent digest
        id: digest
        run: echo "agent_sha256=$(sha256sum dist/runlease-agent-linux-amd64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/*
          if-no-files-found: error

  cli:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [release-please, server]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          AGENT_SHA256: ${{ needs.server.outputs.agent_sha256 }}
        run: |
          test -n "$AGENT_SHA256"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.agentSHA256=${AGENT_SHA256}" \
            -o "dist/runlease-${GOOS}-${GOARCH}${EXT}" ./cmd/runlease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums, signature, upload
    needs: [release-please, server, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum runlease* > checksums.txt && cat checksums.txt
      # Keyless signing writes the repository identity to a public transparency
      # log, so it only runs once the repository itself is public.
      - name: Install cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/runlease*
      - name: Upload to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
