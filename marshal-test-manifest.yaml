# marshal-test-manifest.yaml
#
# Spot instance for testing Marshal end-to-end: k3s + private GCP Artifact
# Registry pulls via kubelet's CredentialProvider plugin (no static tokens,
# no expiration to manage). Marshal images at
# us-central1-docker.pkg.dev/marshal-dev-495114/... pull just-in-time.
#
# Detailed walkthrough (one-time IAM setup, verification commands, deploy
# steps, troubleshooting):  docs/runlease-spot-testing.md
#
# TL;DR:
#   runlease up --attach -m marshal-test-manifest.yaml

name: marshal-test
provider: gcp
region: us-central1-a
instanceClass: compute.large
baseImage: projects/debian-cloud/global/images/family/debian-12

reclaim:
  ttl: 2h
  selfTermination: true

relay:
  addr: wss://relay.snapmatch.ai

sudo: passwordless

gcp:
  # Must have roles/artifactregistry.reader on the AR repos to pull from.
  serviceAccount: ar-puller@marshal-dev-495114.iam.gserviceaccount.com

setup:
  - name: install-auth-provider-gcp
    run: |
      set -euo pipefail

      BIN_DIR=/usr/local/lib/kubelet/credential-providers
      mkdir -p "$BIN_DIR"

      # auth-provider-gcp prebuilt from our fork of kubernetes/cloud-provider-gcp.
      # Upstream doesn't publish a clean standalone binary (GKE bundles it on
      # its node images); we publish a linux/amd64 build at:
      # https://github.com/ofirmakmal/cloud-provider-gcp/releases
      # Rebuild + re-upload: see scripts/build-auth-provider-gcp.sh in the
      # runlease repo for the recipe.
      curl -sfL https://github.com/ofirmakmal/cloud-provider-gcp/releases/download/v0.1.0/auth-provider-gcp-linux-amd64 \
        -o "$BIN_DIR/auth-provider-gcp"
      chmod +x "$BIN_DIR/auth-provider-gcp"
      "$BIN_DIR/auth-provider-gcp" --help >/dev/null  # smoke test

      # Tell kubelet which binary to invoke for which image patterns.
      # 30m cache so we don't shell out on every Pod schedule.
      mkdir -p /etc/kubernetes
      cat > /etc/kubernetes/credential-providers.yaml <<'EOF'
      apiVersion: kubelet.config.k8s.io/v1
      kind: CredentialProviderConfig
      providers:
        - name: auth-provider-gcp
          apiVersion: credentialprovider.kubelet.k8s.io/v1
          matchImages:
            - "*.pkg.dev"
            - "*-docker.pkg.dev"
            - "gcr.io"
            - "*.gcr.io"
          defaultCacheDuration: "30m"
          args:
            - get-credentials
            - --v=3
      EOF

  - name: install-k3s
    run: |
      set -euo pipefail

      # Pin to the same k3s version Marshal's local k3d cluster uses
      # (see marshal/Makefile cluster-create). The ImageVolume feature gate
      # is required for Marshal's MCP integration — MCP packages are mounted
      # as per-MCP OCI image volumes into the mcps container.
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION=v1.36.0+k3s1 \
        INSTALL_K3S_EXEC="server \
          --write-kubeconfig-mode=644 \
          --kube-apiserver-arg=feature-gates=ImageVolume=true \
          --kubelet-arg=feature-gates=ImageVolume=true \
          --kubelet-arg=image-credential-provider-config=/etc/kubernetes/credential-providers.yaml \
          --kubelet-arg=image-credential-provider-bin-dir=/usr/local/lib/kubelet/credential-providers" \
        sh -

      for i in $(seq 1 60); do
        if k3s kubectl get nodes 2>/dev/null | grep -q ' Ready'; then
          echo "k3s ready (${i}s)"
          break
        fi
        sleep 1
      done
      k3s kubectl get nodes
      ss -tlnp | grep -E ':(80|443|6443)\b' || true

  - name: verify-cluster-config
    run: |
      set -euo pipefail
      # Credential provider wired? (otherwise AR pulls fall back to anonymous)
      pgrep -af kubelet | grep -E 'image-credential-provider-(config|bin-dir)' >/dev/null \
        || (echo "ERROR: kubelet did not pick up the credential provider flags" && exit 1)
      echo "✓ Credential provider wired into kubelet."

      # ImageVolume feature gate enabled? (Marshal MCP requirement)
      pgrep -af kubelet      | grep -q 'feature-gates=ImageVolume=true' \
        || (echo "ERROR: kubelet missing feature-gates=ImageVolume=true" && exit 1)
      pgrep -af kube-apiserver | grep -q 'feature-gates=ImageVolume=true' \
        || (echo "ERROR: kube-apiserver missing feature-gates=ImageVolume=true" && exit 1)
      echo "✓ ImageVolume feature gate enabled on kube-apiserver + kubelet."

      # k3s version matches Marshal's pinned dev version
      k3s -v | head -1
      k3s kubectl version -o yaml 2>/dev/null | grep -E 'gitVersion' | head -2

forwards:
  - name: kube-api
    local: 16443
    remote: 6443
  - name: http
    local: 8080
    remote: 80
  - name: https
    local: 8443
    remote: 443
